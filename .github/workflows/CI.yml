# Checks on every push and pull request: pyflakes, unit tests and theme drift for the app, and unit +
# end-to-end tests for the installer (the end-to-end test skips without a local release zip).
# The headless UI suites (Tests/TestUi.mjs) run locally; they need Chrome + puppeteer-core.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13.14'

      - name: Install packages
        run: python -m pip install -r Production/RAMMIT-Stable/requirements.txt

      - name: App - pyflakes, unit tests, theme drift
        working-directory: Production/RAMMIT-Stable
        run: |
          python -m pyflakes App Tests Tools RAMMIT.py
          if ($LASTEXITCODE) { throw "pyflakes found problems" }
          python -m unittest discover -s Tests -p "Test*.py"
          if ($LASTEXITCODE) { throw "app unit tests failed" }
          python Tools/SyncThemes.py --check
          if ($LASTEXITCODE) { throw "theme folders drifted - run python Tools/SyncThemes.py" }

      - name: Installer - pyflakes, unit + end-to-end tests
        working-directory: Production/Installer
        run: |
          python -m pyflakes Installer Tests
          if ($LASTEXITCODE) { throw "pyflakes found problems" }
          python -m unittest discover -s Tests -p "Test*.py"
          if ($LASTEXITCODE) { throw "installer tests failed" }
